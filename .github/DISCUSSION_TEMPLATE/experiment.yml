title: "[Experiment] <실험 주제 요약> (<Adopted | Rejected>)"
body:
  - type: markdown
    attributes:
      value: |
        데이터 분석(EDA), 피처 엔지니어링, 모델 학습 및 튜닝 실험의 가설, 평가지표 비교, 채택·기각 사유를 기록합니다.

  - type: dropdown
    id: verdict
    attributes:
      label: "1. 최종 판정 (Verdict)"
      description: "실험 검증 결과에 따른 파이프라인/모델 반영 여부를 선택합니다."
      options:
        - "Adopted (채택 — 성능 유의미 개선)"
        - "Rejected (기각 — 성능 미달 또는 과적합/비용 문제)"
        - "Follow-up Required (추가 검증 필요)"
    validations:
      required: true

  - type: input
    id: reference
    attributes:
      label: "2. 연관 작업 (References)"
      description: "연관된 스프린트 디스커션 링크 및 실험 코드/PR 경로를 기입합니다."
      placeholder: "[Sprint X](URL) | org/repo#PR_번호"
    validations:
      required: true

  - type: textarea
    id: hypothesis-setup
    attributes:
      label: "3. 실험 가설 및 설계 (Hypothesis & Setup)"
      description: "검증하고자 하는 가설과 데이터 분할 방식, 통제/변경 변인, 평가 지표를 명시합니다."
      value: |
        - **가설 (Hypothesis):** <변경 사항 적용 시 특정 평가 지표 또는 분포에 발생할 기대 변화>
        - **데이터셋 / 분할 전략:** <학습·검증·테스트 기간 또는 교차 검증 방식>
        - **변경 변인:** <Baseline 대비 변경한 피처, 전처리, 모델 구조, 하이퍼파라미터>
        - **평가 지표:** <주 평가 지표 및 보조 지표>
    validations:
      required: true

  - type: textarea
    id: results
    attributes:
      label: "4. 실험 결과 비교 (Results)"
      description: "동일한 검증 기준에서 Baseline 대비 정량적 수치 변화를 기록합니다."
      value: |
        | 구분 | <주 지표명> | <보조 지표명> | 학습/추론 비용 및 특이사항 |
        | :--- | :--- | :--- | :--- |
        | **Baseline** | <수치> | <수치> | <소요 시간/메모리 등> |
        | **Experiment** | <수치> (<증감률>) | <수치> (<증감률>) | <소요 시간/메모리 등> |
    validations:
      required: true

  - type: textarea
    id: conclusion
    attributes:
      label: "5. 결과 해석 및 후속 조치 (Conclusion)"
      description: "성능 변화 또는 과적합 발생의 원인을 분석하고, 프로덕션 반영 여부 및 차기 실험 방향을 정리합니다."
      value: |
        - **결과 해석:** <정량적·통계적 원인 분석>
        - **후속 조치:** <파이프라인 반영 내역 또는 기각 후 대안 실험 계획>
    validations:
      required: true
