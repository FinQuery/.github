title: "[Troubleshooting] "
body:
  - type: markdown
    attributes:
      value: |
        개발, 데이터 파이프라인, 모델 학습 및 인프라 운영 중 발생한 오류·정합성 이슈·성능 병목의 원인 분석(RCA)과 해결 과정을 기록합니다.

  - type: textarea
    id: environment
    attributes:
      label: "1. 기본 정보 및 발생 환경 (Environment)"
      description: "이슈가 발생한 런타임/인프라 환경과 연관된 스프린트 및 PR을 기입합니다."
      value: |
        - **발생 환경:** <OS, Python/라이브러리 버전, DB/컨테이너/서버 스펙 등>
        - **연관 작업:** [Sprint X](<Sprint_Discussion_URL>) | `<org>/<repo>#PR_번호`
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: "2. 현상 및 문제 정의 (Symptom)"
      description: "발생한 에러 핵심 로그, 데이터 정합성 이상 현상 또는 성능 병목 수치를 구체적으로 기술합니다."
      placeholder: "에러 메시지, 비정상 데이터 예시 또는 병목 지표를 기재하세요."
    validations:
      required: true

  - type: textarea
    id: root-cause
    attributes:
      label: "3. 원인 분석 (Root Cause Analysis)"
      description: "원인을 특정하기 위해 수행한 확인 과정(로그 추적, 프로파일링, 가설 검증)과 최종 규명된 근본 원인을 기록합니다."
      value: |
        - **검증 과정:** <확인한 로그, 데이터 분포 점검, 메모리/쿼리 프로파일링 내역>
        - **근본 원인:** <최종 확인된 장애·오류·병목 발생 원인>
    validations:
      required: true

  - type: textarea
    id: resolution
    attributes:
      label: "4. 해결 및 검증 결과 (Resolution & Verification)"
      description: "적용한 수정 사항과 조치 전·후의 정량적 개선 수치 또는 테스트 통과 결과를 명시합니다."
      value: |
        - **조치 내역:** <적용한 코드 수정, 쿼리/메모리 최적화 또는 인프라 설정 변경>
        - **검증 결과:** <조치 전·후 수치 비교 또는 테스트 통과 결과>
    validations:
      required: true

  - type: textarea
    id: prevention
    attributes:
      label: "5. 재발 방지 대책 (Prevention)"
      description: "동일 이슈의 재발을 막기 위해 추가한 테스트 코드, 검증 로직, 모니터링 설정 등을 기록합니다."
      placeholder: "예: 결측/이상치 방어 단위 테스트(pytest) 추가, 배치 알림 임계치 설정 등"
    validations:
      required: true
