title: "[Sprint X] <담당자명/영역> — "
body:
  - type: markdown
    attributes:
      value: |
        개인별 2주 스프린트 계획 및 완료 조건(DoD)을 등록합니다. 진행 중 발생하는 의사결정·실험·트러블슈팅은 개별 작성 후 본 게시글 댓글로 연동합니다.

  - type: textarea
    id: metadata
    attributes:
      label: "1. 기본 정보 (Metadata)"
      description: "스프린트 기간, 상위 릴리즈 디스커션 및 마일스톤 링크, 담당자 정보를 기입합니다."
      value: |
        - **기간:** YYYY.MM.DD ~ YYYY.MM.DD
        - **소속 릴리즈:** [Release vX.Y](<Discussion_URL>) | [Milestone](<Milestone_URL>)
        - **담당자:** @GitHub_ID (<담당 영역>)
    validations:
      required: true

  - type: textarea
    id: mvp-dod
    attributes:
      label: "2. 목표 및 완료 조건 (MVP & DoD)"
      description: "이번 스프린트의 핵심 산출물과 완료 여부를 객관적으로 판별할 수 있는 기준(Definition of Done)을 작성합니다."
      value: |
        - **핵심 산출물 (MVP):** <이번 스프린트 내 완수할 핵심 결과물>
        - **완료 조건 (Definition of Done):**
          - [ ] <검증 가능한 완료 기준 1>
          - [ ] <검증 가능한 완료 기준 2>
          - [ ] 코드 리뷰 승인 및 타겟 브랜치 병합 완료
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "3. 세부 작업 (Tasks)"
      description: "세부 실행 과업을 나열하고 진행에 따라 타 리포지토리 PR 번호(예: org-name/repo-name#12)를 매핑합니다."
      value: |
        - [ ] <세부 작업 항목 1> (`<org>/<repo>#PR_번호`)
        - [ ] <세부 작업 항목 2> (`<org>/<repo>#PR_번호`)
        - [ ] <세부 작업 항목 3> (`<org>/<repo>#PR_번호`)
    validations:
      required: true

  - type: textarea
    id: result-summary
    attributes:
      label: "4. 결과 요약 (Result Summary)"
      description: "스프린트 시작 시에는 기본값을 그대로 두고 등록하며, 종료 시점에 게시글 편집(Edit)을 통해 최종 결과를 기록합니다."
      value: |
        - **달성 현황:** 진행 중 *(스프린트 종료 시 DoD 달성 여부 및 이관 내역 업데이트)*
        - **주요 성과:** -

        ---
        > **실행 로그 댓글 연동 규격**
        > - `[Decision] <의사결정 요약> (<상세 디스커션 링크>)`
        > - `[Experiment] <실험 및 검증 요약> (<상세 디스커션 링크>)`
        > - `[Troubleshooting] <이슈 해결 요약> (<상세 디스커션 링크>)`
    validations:
      required: false
